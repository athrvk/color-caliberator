<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Color Calibrator — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400&display=swap"
  rel="stylesheet">
<style>
:root {
  --bg: #06090e;
  --surface: #0c1118;
  --border: rgba(45,226,196,0.15);
  --accent: #2de2c4;
  --accent-dim: rgba(45,226,196,0.12);
  --amber: #f0a030;
  --amber-dim: rgba(240,160,48,0.15);
  --text: #c8d4dc;
  --text-dim: rgba(200,212,220,0.45);
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  height: 100dvh;
  overflow: hidden;
  position: relative;
}

/* ── viewfinder ── */
#viewfinder {
  width: 100vw;
  height: 100dvh;
  object-fit: cover;
  position: fixed;
  top: 0; left: 0;
  z-index: 0;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#viewfinder.visible { opacity: 1; }

canvas { display: none; }

/* ── spectrum bar ── */
#spectrum {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg,
    #ff2020 0%, #ff8800 16%, #ffe000 33%,
    #2de2c4 50%, #3080ff 66%, #a020ff 83%, #ff2020 100%);
  z-index: 50;
}

/* ── header bar ── */
#header {
  position: fixed;
  top: 3px; left: 0;
  width: 100%;
  padding: 0.55rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(6,9,14,0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 40;
}

#wordmark {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  color: var(--accent);
  text-transform: uppercase;
}

#conn-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #ff3030;
  box-shadow: 0 0 6px #ff3030;
  transition: background 0.4s, box-shadow 0.4s;
}
#conn-dot.live {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

/* ── targeting reticle ── */
#reticle {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 180px; height: 180px;
  transform: translate(-50%, -58%);
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s;
}
#reticle.visible { opacity: 1; }

/* outer dashed orbit */
.reticle-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(45,226,196,0.2);
}
.reticle-ring.outer {
  inset: -40px;
  border-style: dashed;
  border-color: rgba(45,226,196,0.12);
  animation: rotate-ring 12s linear infinite;
}
.reticle-ring.inner {
  inset: 50px;
  border-color: rgba(45,226,196,0.25);
}

@keyframes rotate-ring {
  to { transform: rotate(360deg); }
}

/* corner brackets */
.corner {
  position: absolute;
  width: 20px; height: 20px;
  border-color: var(--accent);
  border-style: solid;
}
.corner.tl { top: 0;    left: 0;   border-width: 2px 0 0 2px; }
.corner.tr { top: 0;    right: 0;  border-width: 2px 2px 0 0; }
.corner.bl { bottom: 0; left: 0;   border-width: 0 0 2px 2px; }
.corner.br { bottom: 0; right: 0;  border-width: 0 2px 2px 0; }

/* center dot + crosshair */
.crosshair {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}
.crosshair::before,
.crosshair::after {
  content: '';
  position: absolute;
  background: rgba(45,226,196,0.6);
}
.crosshair::before { width: 32px; height: 1px; top: 0;   left: -16px; }
.crosshair::after  { width: 1px;  height: 32px; top: -16px; left: 0; }

.center-dot {
  position: absolute;
  top: 50%; left: 50%;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  transform: translate(-50%, -50%);
}

.reticle-label {
  position: absolute;
  bottom: -26px; left: 50%;
  transform: translateX(-50%);
  font-size: 0.58rem;
  letter-spacing: 0.16em;
  color: rgba(45,226,196,0.7);
  white-space: nowrap;
  text-transform: uppercase;
}

/* ── SSNR arc ── */
#ssnr-wrap {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  width: 200px; height: 200px;
  z-index: 11;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s;
}
#ssnr-wrap.visible { opacity: 1; }

#ssnr-svg {
  width: 100%; height: 100%;
  transform: rotate(-90deg);
}
#ssnr-track { fill: none; stroke: rgba(45,226,196,0.1); stroke-width: 2; }
#ssnr-fill  { fill: none; stroke: var(--amber); stroke-width: 2;
              stroke-dasharray: 502; stroke-dashoffset: 502;
              stroke-linecap: round;
              transition: stroke-dashoffset 0.25s ease, stroke 0.25s ease; }

/* ── bottom panel ── */
#panel {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%;
  background: rgba(6,9,14,0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding: 1rem 1.25rem 1.5rem;
  z-index: 30;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

#status-line {
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  color: var(--text);
  line-height: 1.5;
  min-height: 2.2rem;
}
#status-line .label {
  color: var(--text-dim);
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 0.2rem;
}

/* patch progress dots */
#patch-dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}
.pdot {
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 1px solid rgba(45,226,196,0.25);
  background: transparent;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.pdot.active {
  border-color: var(--amber);
  background: var(--amber-dim);
  box-shadow: 0 0 6px var(--amber);
  animation: dot-pulse 0.8s ease-in-out infinite;
}
.pdot.done {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 5px rgba(45,226,196,0.5);
}

@keyframes dot-pulse {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.3); }
}

/* ssnr pips */
#ssnr-pips {
  display: flex;
  gap: 4px;
  align-items: center;
}
.pip {
  width: 5px; height: 14px;
  border-radius: 2px;
  background: rgba(45,226,196,0.12);
  border: 1px solid rgba(45,226,196,0.2);
  transition: background 0.2s, box-shadow 0.2s;
}
.pip.waiting { background: var(--amber-dim); border-color: var(--amber); animation: pip-pulse 1s ease-in-out infinite; }
.pip.stable  { background: var(--accent);    border-color: var(--accent); box-shadow: 0 0 4px var(--accent); animation: none; }

@keyframes pip-pulse {
  0%,100% { opacity: 0.5; }
  50%      { opacity: 1; }
}

/* action buttons */
.btn {
  display: block;
  width: 100%;
  padding: 0.85rem;
  font-family: var(--mono);
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border: 1px solid var(--accent);
  background: var(--accent-dim);
  color: var(--accent);
  border-radius: 4px;
  cursor: pointer;
  text-align: center;
  transition: background 0.2s, box-shadow 0.2s;
}
.btn:active {
  background: rgba(45,226,196,0.25);
  box-shadow: 0 0 12px rgba(45,226,196,0.3);
}
.btn.amber {
  border-color: var(--amber);
  background: var(--amber-dim);
  color: var(--amber);
}
.btn.amber:active { background: rgba(240,160,48,0.25); box-shadow: 0 0 12px rgba(240,160,48,0.3); }
.btn[hidden] { display: none; }

/* upload progress */
#upload-progress {
  height: 2px;
  background: rgba(45,226,196,0.12);
  border-radius: 1px;
  overflow: hidden;
  display: none;
}
#upload-bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.1s linear;
}

/* ── capture flash ── */
#flash {
  position: fixed;
  inset: 0;
  background: var(--accent);
  opacity: 0;
  z-index: 60;
  pointer-events: none;
  transition: opacity 0.08s;
}

/* ── pre-launch splash ── */
#splash {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 70;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  padding: 2rem;
  transition: opacity 0.4s;
}
#splash.gone { opacity: 0; pointer-events: none; }

#splash-title {
  font-family: var(--mono);
  font-size: 1rem;
  letter-spacing: 0.22em;
  color: var(--accent);
  text-transform: uppercase;
}
#splash-sub {
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  text-align: center;
  line-height: 1.7;
}

/* dot-grid bg on splash */
#splash::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(45,226,196,0.08) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
}

/* ── done screen ── */
#done-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 65;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.2rem;
  padding: 2rem;
  display: none;
}
#done-icon {
  font-size: 2.5rem;
  color: var(--accent);
}
#done-title {
  font-size: 0.85rem;
  letter-spacing: 0.18em;
  color: var(--accent);
  text-transform: uppercase;
}
#done-sub {
  font-size: 0.68rem;
  color: var(--text-dim);
  text-align: center;
  line-height: 1.7;
  letter-spacing: 0.05em;
}
</style>
</head>

<body>

  <div id="spectrum"></div>

  <div id="header">
    <span id="wordmark">CAL // MOBILE</span>
    <div id="conn-dot"></div>
  </div>

  <video id="viewfinder" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <!-- targeting reticle (shown when capturing) -->
  <div id="reticle">
    <div class="reticle-ring outer"></div>
    <div class="reticle-ring inner"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="crosshair"></div>
    <div class="center-dot"></div>
    <div class="reticle-label">AIM AT SCREEN</div>
  </div>

  <!-- circular SSNR progress arc -->
  <div id="ssnr-wrap">
    <svg id="ssnr-svg" viewBox="0 0 160 160">
      <circle id="ssnr-track" cx="80" cy="80" r="80" />
      <circle id="ssnr-fill" cx="80" cy="80" r="80" />
    </svg>
  </div>

  <!-- bottom control panel -->
  <div id="panel">
    <div id="status-line">
      <span class="label">Status</span>
      <span id="status-text">Initialising…</span>
    </div>

    <!-- patch progress dots (shown during capture rounds) -->
    <div id="patch-dots" hidden></div>

    <!-- SSNR stability pips -->
    <div id="ssnr-pips" hidden>
      <span class="pip"></span><span class="pip"></span>
      <span class="pip"></span><span class="pip"></span>
      <span class="pip"></span>
    </div>

    <button class="btn" id="ready-btn" hidden>// Ready</button>
    <button class="btn amber" id="upload-raw-btn" hidden>// Upload RAW Photo</button>

    <div id="upload-progress">
      <div id="upload-bar"></div>
    </div>
  </div>

  <div id="flash"></div>

  <!-- splash shown until camera starts -->
  <div id="splash">
    <div id="splash-title">Color Calibrator</div>
    <div id="splash-sub">
      Point your camera at the PC screen.<br>
      Keep the phone steady in the dark.
    </div>
    <button class="btn" id="start-cam-btn" style="pointer-events:auto; position:relative; z-index:1;">// Start
      Camera</button>
  </div>

  <!-- done screen -->
  <div id="done-screen">
    <div id="done-icon">✓</div>
    <div id="done-title">Calibration Complete</div>
    <div id="done-sub">Check your PC screen<br>to download the ICC profile.</div>
  </div>

  <input type="file" id="raw-input" accept=".dng,image/x-adobe-dng" style="display:none;">

  <script src="/static/mobile.js" defer></script>
</body>
</html>
