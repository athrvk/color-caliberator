[project]
name = "color-calibrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "scipy",
    "pillow",
    "qrcode[pil]",
    "cryptography",
    "pytest",
    "pytest-asyncio",
    "rawpy",
    "tifffile",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibration", "src/display", "src/util", "src/web"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
